name: Tägliches Aktien-Update

on:
  schedule:
    - cron: '30 21 * * 1-5' # Läuft Mo-Fr um 21:30 Uhr UTC
  workflow_dispatch: # Manuelles Starten per Klick möglich

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: pip install --upgrade pip && pip install yfinance pandas google-genai

      - name: Analyse-Skript ausführen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_stock.py

      - name: Neue JSON-Daten committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest_analysis.json
          git diff --staged --quiet || (git commit -m "Auto-Update: Aktien- & ETF-Analyse" && git pull --rebase && git push)

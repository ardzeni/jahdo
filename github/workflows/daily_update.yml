name: Tägliches Aktien-Update

on:
  schedule:
    - cron: '0 22 * * 1-5' # Läuft Mo-Fr jeden Tag um 22:00 Uhr UTC
  workflow_dispatch: # Ermöglicht auch den manuellen Start per Knopfdruck

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: pip install yfinance pandas google-genai

      - name: Skript ausführen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_stock.py

      - name: Änderungen automatisch committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest_analysis.json
          git commit -m "Automatisches Tages-Update der Aktienanalyse" || exit 0
          git push
